name: Brain Board

# Publishes the agents/workflows directory, overnight exceptions and maintenance.
# Generated artifacts are served from Pages; owning organs retain their evidence.
# The daily refresh and manual dispatch collect current read-only inputs.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  # A dev-box publish (`pyauto-brain board publish`, an explicit local
  # action) pushes state/devbox_board.json to main — republish so the
  # board shows this morning's local observations a minute later.
  #
  # And whenever the page's own code changes. Merging a renderer or theme
  # change used to leave the published board on yesterday's HTML until the
  # next 05:30 cron, so the repo said one thing and the live page showed
  # another — the emoji-vs-mark gap of #262 was visible for hours after it
  # was fixed. The board is cheap to rebuild; rebuild it when it changes.
  push:
    branches: [main]
    paths:
      - "state/devbox_board.json"
      - "board/**"
      - "config/policy.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: PyAutoBrain
      # The board composes, it does not recompute: the community scan reads
      # the body map (repos.yaml) and the resume section reads the registry +
      # the Mind's own generated dashboard counts, so the Mind is checked out
      # as a sibling — the same two-repo layout tests.yml uses.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PyAutoMind
          path: PyAutoMind
      # Hygiene runs IN THE CLOUD: check out the conductor's scan set
      # (libraries + organs + workspaces + HowTo courses, from the body map —
      # the same declared set a laptop scan reads, PyAutoBrain#735) so its --json
      # pre-scan needs no dev box at all. Blobless clones + a sparse checkout
      # of text/code files keep the big workspace datasets off the runner;
      # a repo that fails to clone is simply absent — hygiene reports
      # repos_present honestly rather than pretending it scanned everything,
      # and the workspace scanners name it NOT SCANNED in their row.
      - name: check out the hygiene scan set (blobless + sparse)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import subprocess, yaml
          from pathlib import Path
          repos = yaml.safe_load(Path("PyAutoMind/repos.yaml").read_text())["repos"]
          # Every other declared repo is cloned REFERENCE-ONLY (no checkout,
          # no blobs): the refs scanner indexes its committed tree with
          # `git ls-tree`, so a `<repo>/path` reference resolves here exactly
          # as it does on a laptop instead of being skipped on the cloud only.
          SCAN = ("library", "organ", "workspace", "howto")
          for name, meta in sorted(repos.items()):
              if Path(name).exists():
                  continue
              home = meta.get("github")
              if not home:
                  continue
              url = f"https://github.com/{home}"
              try:
                  subprocess.run(["git", "clone", "--quiet", "--depth", "1",
                                  "--filter=blob:none", "--no-checkout",
                                  url, name], check=True, timeout=300)
                  if meta.get("category") not in SCAN:
                      continue
                  subprocess.run(["git", "-C", name, "sparse-checkout", "set",
                                  "--no-cone", "*.py", "*.ipynb", "*.rst",
                                  "*.md", "*.txt", "*.yaml", "*.yml", "*.toml",
                                  "*.cfg", "*.ini", "*.sh", ".gitattributes"],
                                 check=True, timeout=60)
                  subprocess.run(["git", "-C", name, "checkout", "--quiet"],
                                 check=True, timeout=600)
              except (subprocess.CalledProcessError,
                      subprocess.TimeoutExpired) as e:
                  print(f"::warning::scan checkout skipped {name}: {e}")
          EOF
      # The hygiene ledger is a PUBLISHED SIDECAR (board/_hygiene_ledger.py):
      # fetch yesterday's from this board's own Pages site, the render upserts
      # today's line, and it publishes beside board.json. No commit, so the job
      # keeps `contents: read` — a ledger commit would need a token that can
      # push to main. Fails closed: any fetch error but a first-publish 404, or
      # a malformed body, stops the job BEFORE deploy, and the render refuses
      # to publish fewer days than were fetched, so the live ledger is never
      # replaced by a shorter one.
      # A 404 ledger beside a board.json that has history is a LOST ledger, not
      # a new one, and also fails; start over only by dispatching with --reset
      # added here on purpose. `?ts=` (plus a no-cache header) bypasses the
      # Pages CDN cache, so the run never appends to a stale copy. A failed
      # fetch blocks that day's board refresh — intended.
      - name: fetch the published hygiene ledger
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 PyAutoBrain/board/_hygiene_ledger.py fetch \
            --url "https://${PAGES_OWNER}.github.io/${PAGES_REPO}/hygiene_ledger.jsonl?ts=${RUN_ID}" \
            --out hygiene_ledger.jsonl
      - name: render the board
        env:
          PYAUTO_ROOT: ${{ github.workspace }}
          BOARD_HYGIENE_SCAN: "1"
          BOARD_HYGIENE_LEDGER: ${{ github.workspace }}/hygiene_ledger.jsonl
          # Homeostasis (maintenance orchestrator): batch maintain's findings
          # and their status in the sibling Mind; publishes homeostasis.json.
          BOARD_HOMEOSTASIS: "1"
          # Heart's published feed only, never a local readiness CLI.
          BOARD_HEART_FEED_ONLY: "1"
        run: |
          python3 PyAutoBrain/board/_board.py --apply --out _site
      # enablement: true creates the Pages site on first run where the token
      # may (Mind/Heart precedent); where it may not (the Hands hit "Resource
      # not accessible by integration"), the site must be created once
      # out-of-band: gh api -X POST repos/<owner>/PyAutoBrain/pages -f build_type=workflow
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
